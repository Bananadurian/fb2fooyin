[project]
name = "fb2fooyin"
version = "0.1.0"
description = "Migrate foobar2000 playback statistics (count/first/last/added/rating) into fooyin"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
fb2fooyin = "fb2fooyin.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fb2fooyin"]
